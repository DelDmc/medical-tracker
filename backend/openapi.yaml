openapi: 3.0.3
info:
  title: Medical Tracker API
  version: 1.0.0
  description: JSON REST API for the Medical Tracker Application MVP (api_contract.md).
paths:
  /api/v1/account/:
    get:
      operationId: account_retrieve
      description: |-
        `GET` / `PATCH /api/v1/account/` — always the authenticated user's own account.

        There is no identifier in the path, so no other account can be addressed
        (ADS-FR-009-01). Changing the timezone leaves stored instants untouched.
      tags:
      - account
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    patch:
      operationId: account_partial_update
      description: |-
        `GET` / `PATCH /api/v1/account/` — always the authenticated user's own account.

        There is no identifier in the path, so no other account can be addressed
        (ADS-FR-009-01). Changing the timezone leaves stored instants untouched.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/account/password/:
    post:
      operationId: account_password_create
      description: |-
        `POST /api/v1/account/password/` — bearer-authenticated, no CSRF (ADS-FR-048-01).

        Success is `200 OK` with an empty body; neither password is ever returned.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        `GET /api/v1/auth/csrf/` — sets or renews the CSRF cookie and returns its token.

        The cookie is HttpOnly (ADS-SEC-005-07), so this response body is the only way the
        frontend obtains the token, which it then holds in memory (ADS-SEC-005-06).
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        `POST /api/v1/auth/login/` — CSRF-protected; no bearer token (ADS-FR-005-01…03).

        Success returns only `access_token` and sets the refresh token in its HttpOnly
        cookie. An unknown email and a wrong password get the identical 401
        (ADS-SEC-006-02).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        `POST /api/v1/auth/logout/` — CSRF-protected; reads the refresh cookie if present.

        A valid refresh token is revoked (ADS-FR-006-02). Whatever the token's state —
        valid, expired, revoked, invalid or missing — the response is the same empty 204
        and the cookie is cleared (ADS-FR-006-03, ADS-FR-006-04). Access tokens already
        issued stay valid until their own expiry (ADS-FR-006-09).
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        `POST /api/v1/auth/refresh/` — rotate the refresh token (ADS-FR-007-01…10).

        The token is read only from the `refresh_token` cookie; there is no JSON body. On
        success the submitted token is revoked and replaced by one carrying the same
        `session_start` (so the seven-day session is never extended). Every invalid,
        expired, revoked, malformed or missing token gets the same 401, no credentials,
        and a cleared cookie.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: '`POST /api/v1/auth/register/` — no bearer token, browser credentials,
        or CSRF.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/categories/:
    get:
      operationId: categories_list
      description: '`GET /api/v1/categories/` — read-only; no create, update or delete
        route exists.'
      tags:
      - categories
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/examinations/:
    get:
      operationId: examinations_list
      description: '`GET` / `POST /api/v1/examinations/` — only the caller''s records;
        a JSON array.'
      tags:
      - examinations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Examination'
          description: ''
    post:
      operationId: examinations_create
      description: '`GET` / `POST /api/v1/examinations/` — only the caller''s records;
        a JSON array.'
      tags:
      - examinations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExaminationRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Examination'
          description: ''
  /api/v1/examinations/{id}/:
    get:
      operationId: examinations_retrieve
      description: |-
        `GET` / `PATCH` / `DELETE /api/v1/examinations/{id}/`.

        The record is looked up only among the caller's own examinations, so a missing
        record and another user's record get the same 404 (ADS-SEC-006-01). `PATCH` is
        partial, but the complete resulting record is validated (ADS-FR-022-01); `PUT` is
        not offered (api_contract.md §12). Deleting cascades to the reminder and the
        recurrence rule and nulls `source_occurrence` on generated occurrences
        (ADS-FR-023-01, ADS-FR-023-02).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - examinations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Examination'
          description: ''
    patch:
      operationId: examinations_partial_update
      description: |-
        `GET` / `PATCH` / `DELETE /api/v1/examinations/{id}/`.

        The record is looked up only among the caller's own examinations, so a missing
        record and another user's record get the same 404 (ADS-SEC-006-01). `PATCH` is
        partial, but the complete resulting record is validated (ADS-FR-022-01); `PUT` is
        not offered (api_contract.md §12). Deleting cascades to the reminder and the
        recurrence rule and nulls `source_occurrence` on generated occurrences
        (ADS-FR-023-01, ADS-FR-023-02).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - examinations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExaminationRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Examination'
          description: ''
    delete:
      operationId: examinations_destroy
      description: |-
        `GET` / `PATCH` / `DELETE /api/v1/examinations/{id}/`.

        The record is looked up only among the caller's own examinations, so a missing
        record and another user's record get the same 404 (ADS-SEC-006-01). `PATCH` is
        partial, but the complete resulting record is validated (ADS-FR-022-01); `PUT` is
        not offered (api_contract.md §12). Deleting cascades to the reminder and the
        recurrence rule and nulls `source_occurrence` on generated occurrences
        (ADS-FR-023-01, ADS-FR-023-02).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - examinations
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: '`GET /api/v1/health/` — ADS-TECH-004-01. Exposes no configuration
        or secret value.'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access_token:
          type: string
      required:
      - access_token
    Account:
      type: object
      description: 'The account representation: `id`, `email`, `timezone` (api_contract.md
        §6.1).'
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        timezone:
          type: string
          readOnly: true
      required:
      - email
      - id
      - timezone
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Examination:
      type: object
      description: |-
        The examination representation and its create/update input (api_contract.md §8).

        Ownership, the source occurrence, the derived time state and the audit instants
        are never accepted from a client (§10); a request that sends one is rejected.
        Every create and update validates the complete resulting record (§8.2).
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        title:
          type: string
          maxLength: 200
        medical_specialty:
          type: string
          nullable: true
          maxLength: 200
        scheduled_date:
          type: string
          format: date
          nullable: true
        scheduled_time:
          type: string
          format: time
          nullable: true
        completed_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        location:
          type: string
          nullable: true
          maxLength: 255
        notes:
          type: string
          nullable: true
        source_occurrence:
          type: integer
          readOnly: true
        time_state:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TimeStateEnum'
          - $ref: '#/components/schemas/NullEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - id
      - source_occurrence
      - status
      - time_state
      - title
      - updated_at
      - user_id
    ExaminationRequest:
      type: object
      description: |-
        The examination representation and its create/update input (api_contract.md §8).

        Ownership, the source occurrence, the derived time state and the audit instants
        are never accepted from a client (§10); a request that sends one is rejected.
        Every create and update validates the complete resulting record (§8.2).
      properties:
        category_id:
          type: integer
          writeOnly: true
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 200
        medical_specialty:
          type: string
          nullable: true
          maxLength: 200
        scheduled_date:
          type: string
          format: date
          nullable: true
        scheduled_time:
          type: string
          format: time
          nullable: true
        completed_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        location:
          type: string
          nullable: true
          maxLength: 255
        notes:
          type: string
          nullable: true
      required:
      - status
      - title
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LoginRequest:
      type: object
      description: '`POST /api/v1/auth/login/` input. Any credential mismatch is a
        generic 401.'
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    NullEnum:
      enum:
      - null
    PasswordChangeRequest:
      type: object
      description: |-
        `POST /api/v1/account/password/` (ADS-FR-048-01).

        The current password must match the stored hash and the new one must pass the
        registration policy; if either check fails nothing is saved.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
      required:
      - current_password
      - new_password
    PatchedAccountUpdateRequest:
      type: object
      description: '`PATCH /api/v1/account/`: only `timezone` is writable (api_contract.md
        §6.2).'
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    PatchedExaminationRequest:
      type: object
      description: |-
        The examination representation and its create/update input (api_contract.md §8).

        Ownership, the source occurrence, the derived time state and the audit instants
        are never accepted from a client (§10); a request that sends one is rejected.
        Every create and update validates the complete resulting record (§8.2).
      properties:
        category_id:
          type: integer
          writeOnly: true
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 200
        medical_specialty:
          type: string
          nullable: true
          maxLength: 200
        scheduled_date:
          type: string
          format: date
          nullable: true
        scheduled_time:
          type: string
          format: time
          nullable: true
        completed_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        location:
          type: string
          nullable: true
          maxLength: 255
        notes:
          type: string
          nullable: true
    RegistrationRequest:
      type: object
      description: '`POST /api/v1/auth/register/` (ADS-FR-001-01 … ADS-FR-004-01,
        ADS-SEC-003-01).'
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
        timezone:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - email
      - password
      - timezone
    StatusEnum:
      enum:
      - draft
      - planned
      - completed
      - cancelled
      - missed
      type: string
      description: |-
        * `draft` - Draft
        * `planned` - Planned
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `missed` - Missed
    TimeStateEnum:
      enum:
      - upcoming
      - overdue
      type: string
      description: |-
        * `upcoming` - upcoming
        * `overdue` - overdue
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
