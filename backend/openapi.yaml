openapi: 3.0.3
info:
  title: Medical Tracker API
  version: 1.0.0
  description: JSON REST API for the Medical Tracker Application MVP (api_contract.md).
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        `GET /api/v1/auth/csrf/` — sets or renews the CSRF cookie and returns its token.

        The cookie is HttpOnly (ADS-SEC-005-07), so this response body is the only way the
        frontend obtains the token, which it then holds in memory (ADS-SEC-005-06).
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        `POST /api/v1/auth/login/` — CSRF-protected; no bearer token (ADS-FR-005-01…03).

        Success returns only `access_token` and sets the refresh token in its HttpOnly
        cookie. An unknown email and a wrong password get the identical 401
        (ADS-SEC-006-02).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: '`POST /api/v1/auth/register/` — no bearer token, browser credentials,
        or CSRF.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: '`GET /api/v1/health/` — ADS-TECH-004-01. Exposes no configuration
        or secret value.'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access_token:
          type: string
      required:
      - access_token
    Account:
      type: object
      description: 'The account representation: `id`, `email`, `timezone` (api_contract.md
        §6.1).'
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        timezone:
          type: string
          readOnly: true
      required:
      - email
      - id
      - timezone
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LoginRequest:
      type: object
      description: '`POST /api/v1/auth/login/` input. Any credential mismatch is a
        generic 401.'
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    RegistrationRequest:
      type: object
      description: '`POST /api/v1/auth/register/` (ADS-FR-001-01 … ADS-FR-004-01,
        ADS-SEC-003-01).'
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
        timezone:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - email
      - password
      - timezone
